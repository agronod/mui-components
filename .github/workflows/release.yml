name: Release

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v2
        with:
          submodules: "true"
          token: ${{ secrets.GITHUBTOKEN }}

      - name: Identify new version
        uses: mathieudutour/github-tag-action@v6.0
        id: tag_version
        with:
          pre_release_branches: feat/*,fix/*
          github_token: ${{ secrets.GITHUBTOKEN }}

      - name: Check out code
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run build --if-present
      - name: Set version and regenerate changelog
        # `--no-git-tag-version` only bumps package.json and package-lock.json.
        # The changelog is then generated with `-u` so the commits since the
        # previous tag land under the version being released (read from
        # package.json), and everything is committed together as the version
        # commit. The remote tag itself is created by the tag action above.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version
          npm run changelog -- -u
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "${{ steps.tag_version.outputs.new_version }}"

      - run: npm publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUBTOKEN }}
          branch: ${{ github.ref }}

      - name: Create a GitHub release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}