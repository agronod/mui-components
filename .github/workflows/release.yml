name: Release

on:
  push:
    branches:
      - main
      - feat/*
      - fix/*
    paths-ignore:
      - ".github/**"
      - "**/*.md"
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.tag_version.outputs.new_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "true"
          token: ${{ secrets.GITHUBTOKEN }}

      - name: Identify new version
        uses: mathieudutour/github-tag-action@v6.0
        id: tag_version
        with:
          pre_release_branches: feat/*,fix/*
          github_token: ${{ secrets.GITHUBTOKEN }}

      - name: Check out code
        uses: actions/checkout@v4
        with:
          # Full history and tags: the changelog is rebuilt from tags, and a
          # shallow clone makes it regenerate as if no release ever existed.
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: npm ci
      - run: npm run build --if-present
      - name: Set version and regenerate changelog
        # `--no-git-tag-version` only bumps package.json and package-lock.json.
        # The tag action above has already pushed the new tag at HEAD and the
        # checkout fetched it, so `npm run changelog` (which rebuilds the file
        # from tags) writes the new version's section itself. Everything is
        # committed together as the version commit.
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          npm version ${{ steps.tag_version.outputs.new_version }} --no-git-tag-version
          if [ "$(git tag | wc -l)" -eq 0 ]; then
            echo "No git tags in the checkout; refusing to regenerate CHANGELOG.md (it would be wiped)."
            exit 1
          fi
          npm run changelog
          git add package.json package-lock.json CHANGELOG.md
          git commit -m "${{ steps.tag_version.outputs.new_version }}"

      - name: Publish
        # npm 11 refuses to publish a prerelease without an explicit dist-tag.
        # Prereleases from feat/* and fix/* go to `next` so `npm install
        # @agronod/mui-components` keeps resolving to the latest stable.
        run: |
          VERSION="${{ steps.tag_version.outputs.new_version }}"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          echo "Publishing $VERSION with dist-tag $TAG"
          npm publish --tag "$TAG"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUBTOKEN }}

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUBTOKEN }}
          branch: ${{ github.ref }}

      - name: Create a GitHub release
        if: ${{ github.ref == 'refs/heads/main' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.tag_version.outputs.new_tag }}
          name: Release ${{ steps.tag_version.outputs.new_tag }}
          body: ${{ steps.tag_version.outputs.changelog }}